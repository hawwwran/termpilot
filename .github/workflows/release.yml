name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points at main
        # Safety check copied from hwntools: refuse to release a tag
        # that isn't on the main branch's tip.
        run: |
          TAG_COMMIT=$(git rev-parse HEAD)
          MAIN_COMMIT=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "Tag points to $TAG_COMMIT but main is at $MAIN_COMMIT — refusing."
            exit 1
          fi

      - name: Stamp VERSION.json
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          DATE="$(date -u +%Y-%m-%d)"
          cat > VERSION.json <<EOF
          {
            "version": "${VER}",
            "released": "${DATE}",
            "tag": "${TAG}"
          }
          EOF
          cat VERSION.json

      - name: Generate VERSION.md changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          {
            echo "# TermPilot ${TAG}"
            echo ""
            echo "Released: $(date -u +%Y-%m-%d)"
            echo ""
            echo "## Changes"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges
            else
              git log --pretty=format:"- %s" --no-merges
            fi
            echo ""
          } > VERSION.md
          cat VERSION.md

      - name: Build Linux/macOS zip
        # tools/build-release.sh stages a flat tree per platform
        # (wrapper + installers + shared/ + VERSION.json + README.md)
        # and zips it. End users see no linux/ or windows/ subdir.
        run: bash tools/build-release.sh linux

      - name: Build Windows zip
        run: bash tools/build-release.sh windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termpilot-linux-macos.zip
            dist/termpilot-windows.zip
          generate_release_notes: true
          body_path: VERSION.md
